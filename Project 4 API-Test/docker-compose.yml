version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: url_shortener_postgres
    restart: always
    environment:
      POSTGRES_DB: links_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: url_shortener_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: url_shortener_api
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
